
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>堺雅人 出演作ガチャ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family:
        -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic", Meiryo, sans-serif;
      background: #f3f0eb;
      color: #333;
    }

    .container {
      width: 100%;
      max-width: 520px;
      padding: 36px 24px;
      text-align: center;
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 27px;
      line-height: 1.5;
    }

    .description {
      margin-bottom: 30px;
      color: #777;
      font-size: 14px;
    }

    #result {
      min-height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #e5e0d8;
      border-radius: 12px;
      background: #faf9f7;
      font-size: 23px;
      font-weight: bold;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    #message {
      min-height: 24px;
      margin: 12px 0;
      color: #777;
      font-size: 14px;
    }

    button {
      width: 100%;
      max-width: 280px;
      padding: 16px 24px;
      border: none;
      border-radius: 999px;
      background: #8b6f52;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .note {
      margin-top: 25px;
      color: #999;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>堺雅人 出演作ガチャ</h1>

    <p class="description">
      ボタンを押して、次に観る作品を決めよう！
    </p>

    <div id="result">
      読み込み中…
    </div>

    <p id="message">Wikipediaから出演作品を取得しています。</p>

    <button id="drawButton" disabled>
      ガチャを回す
    </button>

    <p class="note">
      ※ Wikipediaの出演作品情報をもとに抽選しています。
    </p>
  </main>

  <script>
    // --------------------------------
    // 設定
    // --------------------------------

    const pageTitle = "堺雅人";

    // 抽選対象のジャンル
    const targets = [
      "映画",
      "テレビドラマ",
      "舞台",
      "テレビアニメ",
      "OVA",
      "劇場アニメ",
      "吹き替え",
      "DVD"
    ];

    // 抽選から除外する作品・項目
    const excludedTitles = [
      "劇団☆新感線",
      "双数姉妹",
      "サードステージ",
      "連続テレビ小説",
      "土曜ワイド劇場",
      "パナソニック",
      "山田太一",
      "ドラマW",
      "第三舞台",
      "山田太一 (小説家)",
      "山田太一（小説家）"
    ];

    // 括弧による除外処理から保護する作品
    const exceptions = [
      "世にも奇妙な物語 春の特別編 (2008年)",
      "パンドラ〜永遠の命〜"
    ];

    // 特別なリンク先
    const specialUrls = {
      "エンジン":
        "https://ja.wikipedia.org/wiki/エンジン_(テレビドラマ)",

      "女医":
        "https://ja.wikipedia.org/wiki/女医_(テレビドラマ)",

      "パンドラ〜永遠の命〜":
        "https://ja.wikipedia.org/wiki/パンドラ_(テレビドラマ)#パンドラ〜永遠の命〜",

      "真田丸":
        "https://ja.wikipedia.org/wiki/真田丸_(NHK大河ドラマ)",

      "篤姫":
        "https://ja.wikipedia.org/wiki/篤姫_(NHK大河ドラマ)"
    };


    // --------------------------------
    // 共通処理
    // --------------------------------

    function normalizeTitle(title) {
      return title
        .replace(/_/g, " ")
        .replace(/\s+/g, " ")
        .replace(/\s*（/g, "（")
        .replace(/\s*）/g, "）")
        .replace(/\s*\(/g, " (")
        .replace(/\s*\)/g, ")")
        .trim();
    }

    const excludedSet = new Set(
      excludedTitles.map(normalizeTitle)
    );

    const exceptionSet = new Set(
      exceptions.map(normalizeTitle)
    );

    function isExcluded(title) {
      return excludedSet.has(normalizeTitle(title));
    }

    function isException(title) {
      return exceptionSet.has(normalizeTitle(title));
    }


    // --------------------------------
    // Wikiリンクの解析
    // --------------------------------

    function extractLinksFromLine(line) {

      const links = [];

      // Wikiリンクを一時的に保護
      let cleanLine = line.replace(
        /\[\[([^\]]+)\]\]/g,
        (match) => {
          const index = links.length;
          links.push(match);
          return `WIKILINKTOKEN${index}END`;
        }
      );

      // リンク直後の全角括弧を確認
      // 括弧内の最初の文字が数字以外なら直前のリンクを除外
      cleanLine = cleanLine.replace(
        /WIKILINKTOKEN(\d+)END\s*（([^）]*)）/g,
        (match, index, content) => {

          const rawTitle = links[Number(index)]
            .slice(2, -2)
            .split("|")[0]
            .split("#")[0]
            .trim();

          const title = normalizeTitle(rawTitle);

          // 例外作品は除外しない
          if (isException(title)) {
            return match;
          }

          if (!/^[0-9０-９]/.test(content.trim())) {
            return "";
          }

          return match;
        }
      );

      // Wikiリンクを復元
      cleanLine = cleanLine.replace(
        /WIKILINKTOKEN(\d+)END/g,
        (match, index) => links[Number(index)]
      );

      // 例外作品のリンクを再度保護
      const protectedLinks = [];

      cleanLine = cleanLine.replace(
        /\[\[([^\]]+)\]\]/g,
        (match) => {

          const rawTitle = match
            .slice(2, -2)
            .split("|")[0]
            .split("#")[0]
            .trim();

          if (isException(rawTitle)) {
            const index = protectedLinks.length;
            protectedLinks.push(match);
            return `EXCEPTIONTOKEN${index}END`;
          }

          return match;
        }
      );

      // 括弧内の文字を削除
      cleanLine = cleanLine
        .replace(/（[^）]*）/g, "")
        .replace(/\([^)]*\)/g, "");

      // 例外作品のリンクを復元
      cleanLine = cleanLine.replace(
        /EXCEPTIONTOKEN(\d+)END/g,
        (match, index) => protectedLinks[Number(index)]
      );

      // Wikiリンクを抽出
      const matches = [
        ...cleanLine.matchAll(/\[\[([^\]]+)\]\]/g)
      ];

      return matches.map(match => {

        const raw = match[1];

        const parts = raw.split("|");

        const title = normalizeTitle(
          parts[0].split("#")[0].trim()
        );

        const displayTitle = (
          parts.length > 1
            ? parts[parts.length - 1]
            : title
        ).trim();

        return {
          title,
          displayTitle
        };
      });
    }


    // --------------------------------
    // Wikipediaから出演作品を取得
    // --------------------------------

    async function loadWorks() {

      const apiUrl =
        "https://ja.wikipedia.org/w/api.php" +
        "?action=parse" +
        "&page=" + encodeURIComponent(pageTitle) +
        "&prop=wikitext" +
        "&format=json" +
        "&formatversion=2" +
        "&origin=*";

      const response = await fetch(apiUrl);

      if (!response.ok) {
        throw new Error("Wikipedia APIへの接続に失敗しました。");
      }

      const data = await response.json();

      if (!data.parse || !data.parse.wikitext) {
        throw new Error("出演作品の情報を取得できませんでした。");
      }

      const wikitext = data.parse.wikitext;

      // 「出演」見出しの範囲を取得
      const lines = wikitext.split("\n");

      let inside出演 = false;
      let works = [];
      let currentGenre = "";

      for (const line of lines) {

        const headingMatch = line.match(
          /^(={2,6})\s*(.*?)\s*\1\s*$/
        );

        if (headingMatch) {

          const level = headingMatch[1].length;
          const heading = headingMatch[2].trim();

          // 出演セクション開始
          if (level === 2 && heading === "出演") {
            inside出演 = true;
            currentGenre = "";
            continue;
          }

          // 出演セクション終了
          if (inside出演 && level === 2) {
            break;
          }

          if (inside出演) {
            currentGenre = targets.includes(heading)
              ? heading
              : "";
          }

          continue;
        }

        if (!inside出演 || !currentGenre) {
          continue;
        }

        // 対象ジャンルの行からリンクを取得
        const links = extractLinksFromLine(line);

        if (links.length === 0) {
          continue;
        }

        // 1行につき最初の有効なリンクを採用
        for (const link of links) {

          const title = link.title;

          if (!title) {
            continue;
          }

          // 除外タイトル
          if (isExcluded(title)) {
            continue;
          }

          // Wikipediaの特殊ページなどを除外
          if (
            title.includes(":") ||
            title.startsWith("#") ||
            title.startsWith("ファイル") ||
            title.startsWith("Category:")
          ) {
            continue;
          }

          const url = specialUrls[title] ||
            "https://ja.wikipedia.org/wiki/" +
            encodeURIComponent(title.replace(/ /g, "_"));

          works.push({
            title: link.displayTitle || title,
            url,
            genre: currentGenre
          });

          break;
        }
      }

      // URLで重複を削除
      const uniqueWorks = Array.from(
        new Map(
          works.map(work => [work.url, work])
        ).values()
      );

      return uniqueWorks;
    }


    // --------------------------------
    // 抽選処理
    // --------------------------------

    let works = [];
    let isDrawing = false;

    const resultElement =
      document.getElementById("result");

    const messageElement =
      document.getElementById("message");

    const drawButton =
      document.getElementById("drawButton");


    function draw() {

      if (isDrawing || works.length === 0) {
        return;
      }

      isDrawing = true;
      drawButton.disabled = true;

      resultElement.textContent = "抽選中…";
      messageElement.textContent = "";

      // 抽選演出
      let count = 0;

      const animation = setInterval(() => {

        const randomWork =
          works[Math.floor(Math.random() * works.length)];

        resultElement.textContent = randomWork.title;

        count++;

        if (count >= 12) {

          clearInterval(animation);

          const selected =
            works[Math.floor(Math.random() * works.length)];

          resultElement.textContent = selected.title;

          messageElement.textContent =
            selected.genre + "から選ばれました。";

          isDrawing = false;
          drawButton.disabled = false;

          // 1秒後にWikipediaへ移動
          setTimeout(() => {
            window.location.href = selected.url;
          }, 1000);
        }

      }, 100);
    }


    // --------------------------------
    // 初期化
    // --------------------------------

    async function initialize() {

      try {

        messageElement.textContent =
          "Wikipediaから出演作品を取得しています。";

        works = await loadWorks();

        if (works.length === 0) {
          throw new Error(
            "抽選できる作品が見つかりませんでした。"
          );
        }

        resultElement.textContent = "準備完了！";

        messageElement.textContent =
          works.length + "作品を取得しました。";

        drawButton.disabled = false;

      } catch (error) {

        console.error(error);

        resultElement.textContent = "読み込みエラー";

        messageElement.textContent =
          error.message ||
          "作品情報を取得できませんでした。";

        drawButton.disabled = true;
      }
    }


    drawButton.addEventListener("click", draw);

    initialize();

  </script>
</body>
</html>
