
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>堺雅人 出演作ガチャ</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 60px 20px;
  background: #f5f5f5;
}

h1 {
  font-size: 24px;
}

p {
  color: #555;
}
</style>
</head>

<body>

<h1>堺雅人 出演作ガチャ</h1>
<p id="status">出演作品を抽選しています...</p>

<script>
(async () => {
  const status = document.getElementById("status");
  const api = "https://ja.wikipedia.org/w/api.php";

  // 抽選対象ジャンル
  const targets = [
    "映画",
    "テレビドラマ",
    "舞台",
    "テレビアニメ",
    "OVA",
    "劇場アニメ",
    "吹き替え",
    "DVD"
  ];

  // 抽選対象外
  const excludedTitles = [
    "劇団☆新感線",
    "双数姉妹",
    "サードステージ"
  ];

  // 括弧による除外処理の例外
  const exceptions = [
    "世にも奇妙な物語 春の特別編 (2008年)",
    "パンドラ〜永遠の命〜"
  ];

  // 特定作品の移動先
  const specialUrls = {
    "エンジン":
      "https://ja.wikipedia.org/wiki/エンジン_(テレビドラマ)",

    "女医":
      "https://ja.wikipedia.org/wiki/女医_(テレビドラマ)"
  };

  try {
    status.textContent = "出演作品を調査中...";

    const params = new URLSearchParams({
      action: "parse",
      page: "堺雅人",
      prop: "wikitext",
      format: "json",
      formatversion: "2",
      origin: "*"
    });

    const response = await fetch(api + "?" + params);

    if (!response.ok) {
      throw new Error("Wikipedia通信エラー");
    }

    const data = await response.json();

    if (data.error || !data.parse?.wikitext) {
      throw new Error("Wikipediaデータ取得エラー");
    }

    const wikitext = data.parse.wikitext;

    const candidates = [];
    const lines = wikitext.split("\n");

    let insideAppearance = false;
    let activeCategory = "";
    let activeLevel = 0;

    for (const line of lines) {

      // Wikipediaの見出しを判定
      const heading = line.match(
        /^(={2,6})\s*(.*?)\s*\1\s*$/
      );

      if (heading) {
        const level = heading[1].length;

        const name = heading[2]
          .replace(/\[\[|\]\]/g, "")
          .trim();

        // 出演欄の開始
        if (level === 2 && name.includes("出演")) {
          insideAppearance = true;
          activeCategory = "";
          continue;
        }

        // 次の大見出しで終了
        if (level === 2 && insideAppearance) {
          break;
        }

        if (!insideAppearance) continue;

        // 抽選対象ジャンル
        if (targets.includes(name)) {
          activeCategory = name;
          activeLevel = level;
          continue;
        }

        // 同じ階層以上の別見出しで対象外にする
        if (activeCategory && level <= activeLevel) {
          activeCategory = "";
        }

        continue;
      }

      if (!insideAppearance || !activeCategory) {
        continue;
      }

      // Wikiリンクを一時的に保護
      const links = [];

      let cleanLine = line.replace(
        /\[\[([^\]]+)\]\]/g,
        (match) => {
          const index = links.length;
          links.push(match);
          return `WIKILINKTOKEN${index}END`;
        }
      );

      // 括弧内の最初の文字が数字以外なら
      // 直前のWikiリンクを除外
      cleanLine = cleanLine.replace(
        /WIKILINKTOKEN(\d+)END\s*（([^）]*)）/g,
        (match, index, content) => {

          const rawTitle = links[Number(index)]
            .slice(2, -2)
            .split("|")[0]
            .split("#")[0]
            .trim()
            .replace(/_/g, " ");

          // 例外作品は除外しない
          if (exceptions.includes(rawTitle)) {
            return match;
          }

          // 最初の文字が数字以外なら除外
          if (!/^[0-9０-９]/.test(content.trim())) {
            return "";
          }

          return match;
        }
      );

      // 括弧内にあるWikiリンクを除外
      cleanLine = cleanLine
        .replace(/（[^）]*）/g, "")
        .replace(/\([^)]*\)/g, "");

      // Wikiリンクを復元
      cleanLine = cleanLine.replace(
        /WIKILINKTOKEN(\d+)END/g,
        (match, index) => links[Number(index)]
      );

      // Wikiリンクを取得
      const matches = [
        ...cleanLine.matchAll(/\[\[([^\]]+)\]\]/g)
      ];

      if (!matches.length) continue;

      // 1行につき最初の有効なリンクを採用
      for (const match of matches) {

        const rawTitle = match[1]
          .split("|")[0]
          .split("#")[0]
          .trim();

        if (
          !rawTitle ||
          rawTitle.includes(":") ||
          rawTitle.startsWith("/")
        ) {
          continue;
        }

        // 作品名は括弧内も含めて保持
        const title = rawTitle.replace(/_/g, " ");

        if (!title) continue;

        // 抽選対象外の団体を除外
        if (excludedTitles.includes(title)) {
          continue;
        }

        // 特別な移動先があれば優先
        const url = specialUrls[title] ||
          "https://ja.wikipedia.org/wiki/" +
          encodeURIComponent(rawTitle.replace(/ /g, "_"));

        candidates.push({
          title,
          category: activeCategory,
          url
        });

        break;
      }
    }

    // 重複削除
    const unique = [
      ...new Map(
        candidates.map(item => [item.url, item])
      ).values()
    ];

    console.log("抽選候補:", unique);
    console.log("抽選候補数:", unique.length);

    if (!unique.length) {
      throw new Error(
        "対象作品が見つかりません。出演欄の見出し構造を確認してください。"
      );
    }

    // ランダム抽選
    const selected =
      unique[Math.floor(Math.random() * unique.length)];

    status.textContent =
      selected.category + "：「" +
      selected.title + "」に決定！";

    // 1秒後にWikipediaへ移動
    setTimeout(() => {
      location.href = selected.url;
    }, 1000);

  } catch (error) {
    console.error(error);

    status.textContent =
      "抽選に失敗しました。Consoleでエラーを確認してください。";
  }
})();
</script>

</body>
</html>
