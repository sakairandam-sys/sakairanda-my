
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>堺雅人 出演作ガチャ</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  padding: 60px 20px;
  background: #f5f5f5;
}

h1 {
  font-size: 24px;
}

p {
  color: #555;
}
</style>
</head>

<body>

<h1>堺雅人 出演作ガチャ</h1>
<p id="status">出演作品を抽選しています...</p>

<script>

(async () => {
  const status = document.getElementById("status");
  const api = "https://ja.wikipedia.org/w/api.php";

  try {
    status.textContent = "Wikipediaから出演作品を取得中...";

    const params = new URLSearchParams({
      action: "parse",
      page: "堺雅人",
      prop: "text",
      format: "json",
      origin: "*"
    });

    const response = await fetch(api + "?" + params);

    if (!response.ok) {
      throw new Error("Wikipedia API通信エラー");
    }

    const data = await response.json();

    if (data.error || !data.parse?.text?.["*"]) {
      throw new Error("Wikipediaデータ取得エラー");
    }

    const doc = new DOMParser().parseFromString(
      data.parse.text["*"],
      "text/html"
    );

    // 抽選対象にする出演ジャンル
    const targetCategories = [
      "映画",
      "テレビドラマ",
      "舞台"
    ];

    const candidates = [];

    // Wikipediaの見出しを取得
    const headings = [
      ...doc.querySelectorAll(".mw-heading")
    ];

    // 「出演」の大見出しを探す
    const mainHeading = headings.find(h => {
      const h2 = h.querySelector("h2");
      return h2 && h2.textContent.includes("出演");
    });

    if (!mainHeading) {
      throw new Error("出演見出しが見つかりません");
    }

    let insideAppearance = false;
    let currentCategory = "";

    for (const heading of headings) {

      const h2 = heading.querySelector("h2");
      const h3 = heading.querySelector("h3");

      if (heading === mainHeading) {
        insideAppearance = true;
        continue;
      }

      // 次の大見出しに到達したら終了
      if (insideAppearance && h2) {
        break;
      }

      if (!insideAppearance) continue;

      // 映画・テレビドラマ・舞台の見出しを判定
      if (h3) {
        const category = h3.textContent
          .replace(/\[編集\]/g, "")
          .trim();

        currentCategory =
          targetCategories.includes(category)
            ? category
            : "";

        continue;
      }

      if (!currentCategory) continue;

      // 対象ジャンルの見出しから次の見出しまで取得
      let node = heading.nextElementSibling;

      while (node && !node.matches(".mw-heading")) {

        if (node.matches("ul, ol, table")) {

          const items = node.matches("table")
            ? [...node.querySelectorAll("tr")]
            : [...node.querySelectorAll(":scope > li")];

          for (const item of items) {

            const links = [
              ...item.querySelectorAll('a[href^="/wiki/"]')
            ];

            const a = links.find(link => {
              const href = link.getAttribute("href");
              const title = href
                .split("/wiki/")[1]
                .split("#")[0];

              return (
                title &&
                !title.includes(":") &&
                link.textContent.trim() &&
                !link.closest(".reference")
              );
            });

            if (a) {
              const url = new URL(
                a.getAttribute("href"),
                "https://ja.wikipedia.org"
              );

              candidates.push({
                url: url.href,
                title: a.textContent.trim(),
                category: currentCategory
              });
            }
          }
        }

        node = node.nextElementSibling;
      }
    }

    // URLの重複を削除
    const unique = [
      ...new Map(
        candidates.map(item => [item.url, item])
      ).values()
    ];

    if (!unique.length) {
      throw new Error("対象作品が見つかりません");
    }

    // ランダム抽選
    const selected =
      unique[Math.floor(Math.random() * unique.length)];

    status.textContent =
      selected.category + "：「" +
      selected.title +
      "」に決定！";

    // 少し表示してから作品ページへ移動
    setTimeout(() => {
      location.href = selected.url;
    }, 800);

  } catch (error) {
    console.error("ガチャエラー:", error);

    status.textContent =
      "抽選に失敗しました。もう一度アクセスしてください。";
  }
})();
;
</script>

</body>
</html>
